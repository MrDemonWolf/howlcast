name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy via Alchemy
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json

      - name: Cache bun install
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Next.js build
        uses: actions/cache@v5
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('apps/web/next.config.ts') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            nextjs-${{ runner.os }}-

      - name: Deploy via Alchemy
        run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
          ALCHEMY_STATE_TOKEN: ${{ secrets.ALCHEMY_STATE_TOKEN }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: https://api.tv.mrdemonwolf.com
          CORS_ORIGIN: https://tv.mrdemonwolf.com
          NEXT_PUBLIC_SERVER_URL: https://api.tv.mrdemonwolf.com
          MAIL_FROM: ${{ vars.MAIL_FROM || 'HowlCast <invites@mail.howlcast.tv>' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          STREAM_API_KEY: ${{ secrets.STREAM_API_KEY }}
          STREAM_API_SECRET: ${{ secrets.STREAM_API_SECRET }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}

      - name: Smoke-test API health (workers.dev — always ready)
        run: |
          sleep 5
          HEALTH=$(curl -sf https://tv-api.mrdemonwolf.workers.dev/api/health || echo "FAILED")
          echo "API health (workers.dev): $HEALTH"
          if [ "$HEALTH" != '{"ok":true}' ]; then
            echo "ERROR: API health check failed"
            exit 1
          fi

      - name: Smoke-test API custom domain (with retry)
        continue-on-error: true
        run: |
          for i in 1 2 3 4 5 6; do
            HEALTH=$(curl -sf https://api.tv.mrdemonwolf.com/api/health || echo "FAILED")
            if [ "$HEALTH" = '{"ok":true}' ]; then
              echo "API custom domain healthy after ${i} attempt(s): $HEALTH"
              exit 0
            fi
            echo "Attempt $i: api.tv.mrdemonwolf.com not ready (DNS/SSL warming)..."
            sleep 15
          done
          echo "WARN: api.tv.mrdemonwolf.com not responding after 90s — first-deploy DNS propagation."
          exit 0

      - name: Smoke-test web proxy (workers.dev)
        run: |
          PROXIED=$(curl -sf https://tv.mrdemonwolf.workers.dev/api/health || echo "FAILED")
          echo "Web proxy health (workers.dev): $PROXIED"
          if [ "$PROXIED" != '{"ok":true}' ]; then
            echo "ERROR: Web /api/* proxy is broken"
            exit 1
          fi

      - name: Smoke-test custom domain (with retry)
        continue-on-error: true
        run: |
          for i in 1 2 3 4 5 6; do
            PROXIED=$(curl -sf https://tv.mrdemonwolf.com/api/health || echo "FAILED")
            if [ "$PROXIED" = '{"ok":true}' ]; then
              echo "Custom domain healthy after ${i} attempt(s): $PROXIED"
              exit 0
            fi
            echo "Attempt $i: tv.mrdemonwolf.com not ready yet (DNS/SSL warming up)..."
            sleep 15
          done
          echo "WARN: tv.mrdemonwolf.com not responding after 90s — likely first-deploy DNS propagation. Check manually."
          exit 0

      - name: Smoke-test public tRPC endpoints
        run: |
          set -e
          BASE=https://tv-api.mrdemonwolf.workers.dev

          echo "→ branding.get"
          BRANDING=$(curl -sfL "$BASE/api/trpc/branding.get")
          echo "$BRANDING" | jq -e '.result.data.platformName | type == "string"' >/dev/null

          echo "→ stream.isLive"
          LIVE=$(curl -sfL "$BASE/api/trpc/stream.isLive")
          echo "$LIVE" | jq -e '.result.data.isLive | type == "boolean"' >/dev/null

          echo "→ branding.getLegal (privacy)"
          PRIVACY=$(curl -sfL "$BASE/api/trpc/branding.getLegal?input=%7B%22id%22%3A%22privacy%22%7D")
          echo "$PRIVACY" | jq -e '.result.data.bodyHtml | type == "string"' >/dev/null

          echo "tRPC public endpoints OK"

      - name: Smoke-test public web routes
        run: |
          set -e
          BASE=https://tv.mrdemonwolf.workers.dev

          for path in "/" "/privacy" "/terms" "/login" "/robots.txt" "/sitemap.xml"; do
            CODE=$(curl -sL -o /dev/null -w '%{http_code}' "$BASE$path")
            if [ "$CODE" != "200" ]; then
              echo "ERROR: $path returned $CODE (expected 200)"
              exit 1
            fi
            echo "  ✓ $path → 200"
          done

      - name: Smoke-test auth-gated routes redirect
        run: |
          set -e
          BASE=https://tv.mrdemonwolf.workers.dev

          for path in "/dashboard" "/account"; do
            CODE=$(curl -sL -o /dev/null -w '%{http_code}' --max-redirs 0 "$BASE$path")
            # Next.js redirect helpers return 307. Accept 302 for safety.
            if [ "$CODE" != "307" ] && [ "$CODE" != "302" ]; then
              echo "ERROR: $path returned $CODE (expected 307/302 redirect)"
              exit 1
            fi
            echo "  ✓ $path → $CODE (redirect)"
          done
