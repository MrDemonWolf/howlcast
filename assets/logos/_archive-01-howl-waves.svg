<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- HowlCast — Variant 1: Howl Waves
       Concept: broadcast/sonar arcs radiating from a wolf snout point.
       Reads as "broadcasting" first, "wolf" on closer look.
  -->
  <path d="M 18 64 A 32 32 0 0 1 82 64" stroke="#0FACED" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M 30 64 A 20 20 0 0 1 70 64" stroke="#0FACED" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M 42 64 A 8 8 0 0 1 58 64" stroke="#0FACED" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- Snout wedge below the waves -->
  <path d="M 42 64 L 50 80 L 58 64 Z" fill="#0FACED"/>
</svg>
