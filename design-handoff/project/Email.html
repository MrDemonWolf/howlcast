<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HowlCast — Invite Emails</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=Geist+Mono:wght@400;500;600&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared.css" />

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    body{padding-top:48px;background:var(--bg)}
    .view-switcher{position:fixed;top:0;left:0;right:0;height:48px;z-index:100;
      background:oklch(0.183 0.067 271 / 0.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
      border-bottom:1px solid var(--line);
      display:flex;align-items:center;justify-content:space-between;padding:0 20px}
    .view-switcher .crumbs{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fg-3);font-family:var(--font-mono);letter-spacing:0.04em}
    .view-switcher .crumbs b{color:var(--fg);font-weight:500}
    .view-tabs{display:flex;gap:2px;background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:3px}
    .view-tabs a{height:28px;padding:0 12px;display:inline-flex;align-items:center;font-size:12px;font-weight:500;color:var(--fg-3);border-radius:5px}
    .view-tabs a.active{background:var(--bg-3);color:var(--fg)}
    .view-tabs a:hover{color:var(--fg)}
    .view-meta{font-family:var(--font-mono);font-size:10px;color:var(--fg-4);letter-spacing:0.06em}

    /* layout: 3 columns — template list, edit form, live preview */
    .em{display:grid;grid-template-columns:240px 360px minmax(0,1fr);min-height:calc(100vh - 48px)}
    .em-list{
      border-right:1px solid var(--line);background:var(--bg);padding:18px 12px;
      display:flex;flex-direction:column;gap:14px;
      position:sticky;top:48px;height:calc(100vh - 48px);overflow-y:auto;
    }
    .em-list h1{font-family:var(--font-display);font-size:16px;font-weight:600;margin:0;padding:0 6px}
    .em-list .sender{
      padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);
      background:var(--bg-2);
    }
    .em-list .sender .k{font-family:var(--font-mono);font-size:9px;letter-spacing:0.08em;text-transform:uppercase;color:var(--fg-4)}
    .em-list .sender .v{font-family:var(--font-mono);font-size:12px;color:var(--cyan);margin-top:2px;display:flex;align-items:center;gap:6px}
    .em-list .sender .v::before{content:"";width:6px;height:6px;border-radius:999px;background:var(--success)}
    .em-list .sec-h{font-family:var(--font-mono);font-size:9px;letter-spacing:0.08em;text-transform:uppercase;color:var(--fg-4);padding:0 6px}
    .em-tpl{
      display:flex;flex-direction:column;gap:4px;padding:10px 12px;
      border-radius:var(--radius-sm);cursor:pointer;
      border:1px solid transparent;
    }
    .em-tpl:hover{background:var(--bg-2)}
    .em-tpl.active{background:var(--bg-2);border-color:var(--cyan-soft)}
    .em-tpl .name{font-size:13px;font-weight:600;color:var(--fg);display:flex;align-items:center;gap:6px}
    .em-tpl .name .ind{width:6px;height:6px;border-radius:999px;flex:none}
    .em-tpl .name .ind.live{background:var(--success)}
    .em-tpl .name .ind.draft{background:var(--fg-4)}
    .em-tpl .desc{font-size:11px;color:var(--fg-3);line-height:1.4}
    .em-tpl .stats{font-family:var(--font-mono);font-size:10px;color:var(--fg-4);letter-spacing:0.04em;margin-top:2px}

    .em-edit{
      border-right:1px solid var(--line);background:var(--bg);padding:24px 24px 32px;
      display:flex;flex-direction:column;gap:18px;overflow-y:auto;
      position:sticky;top:48px;height:calc(100vh - 48px);
    }
    .em-edit-h{display:flex;flex-direction:column;gap:6px}
    .em-edit-h h2{font-family:var(--font-display);font-size:22px;font-weight:600;margin:0;letter-spacing:-0.01em}
    .em-edit-h .sub{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);letter-spacing:0.04em}
    .em-edit-h .badge{display:inline-flex;width:fit-content;align-items:center;gap:5px;font-family:var(--font-mono);font-size:9px;letter-spacing:0.08em;text-transform:uppercase;background:oklch(0.4 0.1 162 / 0.4);color:var(--success);border:1px solid oklch(0.5 0.13 162);padding:3px 7px;border-radius:4px;margin-top:4px}
    .em-edit-h .badge.draft{background:var(--bg-3);color:var(--fg-3);border-color:var(--line)}

    .em-fld{display:flex;flex-direction:column;gap:6px}
    .em-fld > label{font-family:var(--font-mono);font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--fg-3)}
    .em-fld textarea.input{min-height:88px;resize:vertical;line-height:1.5;font-family:inherit}
    .em-fld .hint{font-size:11px;color:var(--fg-4)}
    .em-fld .pre{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);background:var(--bg-3);padding:6px 8px;border-radius:5px;border:1px solid var(--line)}

    .vars{display:flex;flex-wrap:wrap;gap:4px}
    .var{
      font-family:var(--font-mono);font-size:10px;color:var(--cyan);
      background:var(--cyan-soft);border:1px solid var(--cyan);
      padding:2px 6px;border-radius:4px;cursor:pointer;
    }
    .var:hover{background:var(--cyan);color:#091533}

    .em-cta-row{display:flex;gap:8px;padding-top:6px;border-top:1px solid var(--line);margin-top:auto}

    /* preview pane */
    .em-preview{
      background:oklch(0.13 0.04 271);padding:24px 32px 48px;display:flex;flex-direction:column;gap:18px;
      min-width:0;
    }
    .preview-h{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
    .preview-h h3{margin:0;font-size:13px;font-weight:600;font-family:var(--font-mono);letter-spacing:0.04em;color:var(--fg-3);text-transform:uppercase}
    .device-toggle{display:inline-flex;background:var(--bg-2);border:1px solid var(--line);border-radius:6px;padding:3px;gap:2px}
    .device-toggle button{
      height:28px;padding:0 12px;font-size:12px;font-weight:500;color:var(--fg-3);
      background:transparent;border:0;border-radius:4px;cursor:pointer;font-family:inherit;
      display:inline-flex;align-items:center;gap:6px;
    }
    .device-toggle button.on{background:var(--bg-3);color:var(--fg)}
    .device-toggle svg{width:13px;height:13px}

    /* the email itself, rendered as HTML the way an inbox would */
    .inbox{
      background:#f5f4ee;
      border-radius:var(--radius-lg);
      padding:0;
      box-shadow:0 30px 80px rgba(0,0,0,0.4), 0 8px 20px rgba(0,0,0,0.25);
      overflow:hidden;
      display:flex;flex-direction:column;
      align-self:flex-start;
    }
    .inbox.desktop{width:100%;max-width:720px}
    .inbox.mobile{width:380px;max-width:100%}
    .inbox-h{
      display:flex;align-items:center;gap:10px;padding:14px 18px;
      background:#fff;border-bottom:1px solid #e8e6dd;
      color:#1a1a1a;font-family:var(--font-ui);
    }
    .inbox-h .from-av{
      width:36px;height:36px;border-radius:999px;
      background:linear-gradient(135deg, oklch(0.59 0.22 240), oklch(0.5 0.27 280));
      display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;
      font-family:var(--font-display);flex:none;
    }
    .inbox-h .from{display:flex;flex-direction:column;line-height:1.3;min-width:0;flex:1}
    .inbox-h .from b{font-size:13px;color:#0a0a0a}
    .inbox-h .from span{font-size:12px;color:#5a5a5a}
    .inbox-h .from span .em{color:#888}
    .inbox-h .at{font-family:var(--font-mono);font-size:11px;color:#888}
    .inbox-subj{
      padding:14px 22px 6px;background:#fff;
      font-size:18px;font-weight:600;color:#0a0a0a;
      font-family:var(--font-display);letter-spacing:-0.01em;
    }
    .inbox-pre{
      padding:0 22px 14px;background:#fff;
      font-size:13px;color:#5a5a5a;border-bottom:1px solid #e8e6dd;
    }

    /* the actual mail body — designed dark to match brand */
    .mail{background:oklch(0.183 0.067 271);color:#e6e8ee;font-family:var(--font-ui)}
    .mail-banner{
      position:relative;padding:48px 32px 36px;
      background:radial-gradient(circle at 30% 20%, oklch(0.5 0.2 235 / 0.55), transparent 60%),
                 radial-gradient(circle at 80% 90%, oklch(0.45 0.22 285 / 0.45), transparent 65%),
                 oklch(0.183 0.067 271);
      border-bottom:1px solid oklch(0.34 0.08 250 / 0.4);
      overflow:hidden;
    }
    .mail-banner::before{
      content:"";position:absolute;inset:0;
      background-image:radial-gradient(circle, rgba(255,255,255,0.06) 1px, transparent 1px);
      background-size:24px 24px;mask-image:radial-gradient(circle at 50% 100%, #000 30%, transparent 70%);
      pointer-events:none;
    }
    .mail-brand{
      display:inline-flex;align-items:center;gap:9px;
      font-family:var(--font-display);font-weight:700;font-size:15px;color:#fff;
      letter-spacing:-0.01em;
      position:relative;z-index:1;
    }
    .mail-brand .mark{
      width:26px;height:26px;border-radius:8px;
      background:linear-gradient(135deg, oklch(0.706 0.2 204), oklch(0.55 0.22 280));
      display:flex;align-items:center;justify-content:center;color:#091533;font-weight:800;font-size:13px;
      font-family:var(--font-display);
      box-shadow:0 0 0 1px rgba(255,255,255,0.15) inset, 0 4px 14px oklch(0.706 0.2 204 / 0.4);
    }
    .mail-eyebrow{
      font-family:var(--font-mono);font-size:11px;letter-spacing:0.12em;text-transform:uppercase;
      color:oklch(0.706 0.2 204);margin-top:24px;position:relative;z-index:1;
    }
    .mail-h1{
      font-family:var(--font-display);font-size:32px;font-weight:600;
      letter-spacing:-0.025em;line-height:1.1;color:#fff;
      margin:6px 0 0;max-width:480px;position:relative;z-index:1;
    }
    .mail-h1 em{color:oklch(0.706 0.2 204);font-style:normal}

    .mail-body{padding:32px;display:flex;flex-direction:column;gap:18px}
    .mail-body p{margin:0;font-size:15px;line-height:1.6;color:#cdd0db}
    .mail-body p.lead{font-size:16px;color:#e6e8ee}
    .mail-body strong{color:#fff;font-weight:600}

    .mail-cta{
      align-self:flex-start;display:inline-flex;align-items:center;gap:8px;
      background:oklch(0.706 0.2 204);color:#091533;
      padding:14px 22px;border-radius:8px;text-decoration:none;
      font-weight:600;font-size:14px;font-family:inherit;letter-spacing:-0.005em;
      box-shadow:0 0 0 1px oklch(0.78 0.18 204) inset, 0 8px 20px oklch(0.706 0.2 204 / 0.3);
      transition:transform 0.15s;
    }
    .mail-cta:hover{transform:translateY(-1px)}
    .mail-cta-secondary{
      align-self:flex-start;display:inline-flex;align-items:center;gap:8px;
      background:transparent;color:#cdd0db;
      padding:13px 21px;border-radius:8px;text-decoration:none;
      font-weight:500;font-size:14px;border:1px solid oklch(0.34 0.06 250);
    }

    /* signature block */
    .mail-sig{
      display:grid;grid-template-columns:48px 1fr;gap:14px;align-items:center;
      padding:18px;border:1px solid oklch(0.34 0.06 250 / 0.5);border-radius:12px;
      background:oklch(0.21 0.06 270 / 0.5);
    }
    .mail-sig .av{
      width:48px;height:48px;border-radius:999px;
      background:linear-gradient(135deg, oklch(0.59 0.22 240), oklch(0.5 0.27 280));
      color:#fff;display:flex;align-items:center;justify-content:center;
      font-family:var(--font-display);font-weight:700;font-size:18px;
      box-shadow:0 0 0 2px oklch(0.706 0.2 204 / 0.4);
    }
    .mail-sig b{display:block;font-size:14px;color:#fff;font-weight:600}
    .mail-sig span{display:block;font-size:12px;color:#9da2b3;font-family:var(--font-mono);letter-spacing:0.04em}

    /* feature panel — the den */
    .mail-feat{
      padding:18px;border-radius:12px;
      background:oklch(0.21 0.06 270 / 0.6);border:1px solid oklch(0.34 0.06 250 / 0.5);
      display:flex;flex-direction:column;gap:10px;
    }
    .mail-feat .lbl{
      font-family:var(--font-mono);font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:oklch(0.706 0.2 204);
    }
    .mail-feat .row{display:flex;align-items:center;gap:14px}
    .mail-feat .row .icon{
      width:36px;height:36px;border-radius:8px;
      background:oklch(0.42 0.09 235 / 0.5);border:1px solid oklch(0.706 0.2 204 / 0.4);
      display:flex;align-items:center;justify-content:center;color:oklch(0.85 0.12 200);
      flex:none;
    }
    .mail-feat .row .icon svg{width:16px;height:16px}
    .mail-feat .row .det b{display:block;font-size:14px;color:#fff;font-weight:600}
    .mail-feat .row .det span{display:block;font-size:12px;color:#9da2b3}
    .mail-divider{height:1px;background:oklch(0.34 0.06 250 / 0.4);margin:0 -32px}
    .mail-foot{
      padding:24px 32px;font-size:11px;color:#7a7e90;line-height:1.6;
      border-top:1px solid oklch(0.34 0.06 250 / 0.4);
      font-family:var(--font-mono);letter-spacing:0.02em;
    }
    .mail-foot a{color:#9da2b3;text-decoration:underline}
    .mail-foot .mark{
      display:inline-flex;align-items:center;gap:6px;color:#cdd0db;font-family:var(--font-display);font-weight:600;letter-spacing:-0.01em;text-transform:none;font-size:13px;
      margin-bottom:10px;
    }
    .mail-foot .mark .m{
      width:18px;height:18px;border-radius:5px;background:linear-gradient(135deg, oklch(0.706 0.2 204), oklch(0.55 0.22 280));
      color:#091533;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:10px;
    }

    /* alt: stream-starting template — vibrant LIVE banner */
    .mail-live{
      padding:48px 32px;
      background:radial-gradient(circle at 70% 30%, oklch(0.55 0.27 25 / 0.6), transparent 60%),
                 oklch(0.183 0.067 271);
      text-align:center;
      border-bottom:1px solid oklch(0.34 0.06 250 / 0.4);
      position:relative;
    }
    .mail-live .pill{
      display:inline-flex;align-items:center;gap:7px;
      font-family:var(--font-mono);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;
      background:oklch(0.65 0.24 25);color:#fff;padding:5px 11px;border-radius:5px;font-weight:600;
      box-shadow:0 0 0 4px oklch(0.65 0.24 25 / 0.2), 0 0 20px oklch(0.65 0.24 25 / 0.4);
    }
    .mail-live .pill .dot{width:7px;height:7px;border-radius:999px;background:#fff;animation:livepulse 1.6s ease-in-out infinite}
    @keyframes livepulse{0%,100%{opacity:1}50%{opacity:0.4}}
    .mail-live h2{font-family:var(--font-display);font-size:34px;font-weight:600;letter-spacing:-0.025em;line-height:1.1;color:#fff;margin:18px 0 6px}
    .mail-live p{margin:0;color:#cdd0db;font-size:14px}

    /* template chip / copy variants */
    .mail-quote{
      padding:18px 22px;border-left:3px solid oklch(0.706 0.2 204);
      background:oklch(0.42 0.09 235 / 0.12);border-radius:0 8px 8px 0;
    }
    .mail-quote p{font-size:14px;font-style:italic;color:#cdd0db;margin:0;line-height:1.6}
    .mail-quote cite{font-style:normal;font-family:var(--font-mono);font-size:11px;color:#9da2b3;letter-spacing:0.04em;display:block;margin-top:8px}

    @media(max-width:1100px){
      .em{grid-template-columns:1fr}
      .em-list, .em-edit{position:static;height:auto}
      .em-preview{padding:24px}
    }
  </style>
</head>
<body>
  <div class="view-switcher">
    <div class="crumbs"><span>HowlCast</span><span>›</span><b>Invite emails</b></div>
    <nav class="view-tabs">
      <a href="HowlCast.html">Channel</a>
      <a href="Dashboard.html">Dashboard</a>
      <a href="Account.html">Account</a>
      <a href="Email.html" class="active">Email</a>
    </nav>
    <span class="view-meta">v0.2 · prototype</span>
  </div>

  <div id="email-app" data-screen-label="Email — Invite Templates"></div>

  <script type="text/babel">
    const {useState, useMemo} = React;

    const TEMPLATES = [
      {
        id: 'invite',
        name: 'Private stream invite',
        desc: 'Sent before you go live · invite-only viewers',
        status: 'live',
        sentCount: 312,
        kind: 'invite',
        defaults: {
          subject: 'You\'re on the list for {{date}} 🐺',
          preheader: 'Private stream — link inside, link only works for you.',
          eyebrow: 'Private invite',
          headline: 'You\'re on the list for *{{date}}*.',
          lead: 'Hey {{firstName}} — going live **{{date}} at {{time}}** with **{{streamTitle}}**. This stream is invite-only and the link below is tied to your email.',
          body: 'No need to RSVP. Just click through when you\'re around — the channel will be offline until the stream starts. Save the link; don\'t share it.',
          cta: 'Open the stream',
          ctaSecondary: '',
          quote: 'A small den, not a big arena. We\'re here for the slow stream, not the spectacle.',
          quoteSrc: 'The Den Rules — pinned in chat',
        },
      },
    ];

    const VARS = ['{{firstName}}', '{{streamTitle}}', '{{channelUrl}}', '{{date}}', '{{time}}'];

    function Avatar(){ return <div className="from-av">M</div>; }

    function MailContent({ t, kind }){
      const renderBody = (txt) => {
        // Convert *text* to <em>, **text** to <strong>
        return txt.split(/(\*\*[^*]+\*\*|\*[^*]+\*|\{\{[^}]+\}\})/g).map((part, i) => {
          if (/^\*\*[^*]+\*\*$/.test(part)) return <strong key={i}>{part.slice(2,-2)}</strong>;
          if (/^\*[^*]+\*$/.test(part)) return <em key={i}>{part.slice(1,-1)}</em>;
          if (/^\{\{[^}]+\}\}$/.test(part)) return <span key={i} style={{color:'oklch(0.706 0.2 204)',fontFamily:'var(--font-mono)',fontSize:'0.92em'}}>{part}</span>;
          return part;
        });
      };

      if (kind === 'starting') {
        return (
          <div className="mail">
            <div className="mail-live">
              <div className="pill"><span className="dot"></span>Live</div>
              <h2>{renderBody(t.headline)}</h2>
              <p>Wolf Run dev · streaming now · 1080p60</p>
            </div>
            <div className="mail-body">
              <p className="lead">{renderBody(t.lead)}</p>
              {t.body && <p>{renderBody(t.body)}</p>}
              <a className="mail-cta" href="#">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><polygon points="6 4 20 12 6 20 6 4" fill="currentColor"/></svg>
                {t.cta}
              </a>
              {t.ctaSecondary && <a className="mail-cta-secondary" href="#">{t.ctaSecondary}</a>}
              <div className="mail-sig">
                <div className="av">M</div>
                <div>
                  <b>MrDemonWolf</b>
                  <span>howling since may 2026</span>
                </div>
              </div>
            </div>
            <div className="mail-foot">
              <div className="mark"><span className="m">H</span>HowlCast</div>
              You got this because you opted in for live alerts. <a href="#">Mute these</a> · <a href="#">Manage all email</a><br/>
              Sent from howlcast@mrdemonwolf.com · self-hosted, no trackers
            </div>
          </div>
        );
      }

      // default invite layout
      return (
        <div className="mail">
          <div className="mail-banner">
            <div className="mail-brand"><span className="mark">H</span>HowlCast</div>
            <div className="mail-eyebrow">{t.eyebrow}</div>
            <h1 className="mail-h1">{renderBody(t.headline)}</h1>
          </div>
          <div className="mail-body">
            <p className="lead">{renderBody(t.lead)}</p>
            {t.body && <p>{renderBody(t.body)}</p>}

            {t.quote && (
              <div className="mail-quote">
                <p>"{t.quote}"</p>
                {t.quoteSrc && <cite>— {t.quoteSrc}</cite>}
              </div>
            )}

            <div className="mail-feat">
              <span className="lbl">Stream details</span>
              <div className="row">
                <span className="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span>
                <div className="det"><b>{`{{date}} · {{time}} CT`}</b><span>{`{{streamTitle}}`}</span></div>
              </div>
              <div className="row">
                <span className="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
                <div className="det"><b>Private link · tied to your email</b><span>Don't share — won't work for anyone else</span></div>
              </div>
            </div>

            <a className="mail-cta" href="#">
              {t.cta}
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </a>
            {t.ctaSecondary && <a className="mail-cta-secondary" href="#">{t.ctaSecondary}</a>}

            <div className="mail-sig">
              <div className="av">M</div>
              <div>
                <b>— Wolf <span style={{color:'#9da2b3',fontWeight:400}}>(MrDemonWolf)</span></b>
                <span>howlcast@mrdemonwolf.com</span>
              </div>
            </div>
          </div>
          <div className="mail-foot">
            <div className="mark"><span className="m">H</span>HowlCast</div>
            This invite was sent personally by MrDemonWolf. Don't share the link — it's tied to your email.<br/>
            Self-hosted on mrdemonwolf.com infrastructure · no trackers, no pixels · <a href="#">unsubscribe</a>
          </div>
        </div>
      );
    }

    function App(){
      const [activeId, setActiveId] = useState('invite');
      const [device, setDevice] = useState('desktop');
      const [drafts, setDrafts] = useState(() => {
        const out = {};
        TEMPLATES.forEach(t => { out[t.id] = {...t.defaults}; });
        return out;
      });
      const tpl = TEMPLATES.find(t => t.id === activeId);
      const t = drafts[activeId];
      const set = (k, v) => setDrafts(d => ({...d, [activeId]: {...d[activeId], [k]: v}}));

      return (
        <div className="em">
          <aside className="em-list">
            <h1>Email designer</h1>
            <div className="sender">
              <div className="k">From address</div>
              <div className="v">howlcast@mrdemonwolf.com</div>
            </div>
            <div className="sec-h">Templates</div>
            {TEMPLATES.map(x => (
              <div key={x.id} className={`em-tpl ${x.id===activeId?'active':''}`} onClick={() => setActiveId(x.id)}>
                <div className="name">
                  <span className={`ind ${x.status}`}></span>
                  {x.name}
                </div>
                <div className="desc">{x.desc}</div>
                <div className="stats">{x.sentCount.toLocaleString()} sent · {x.status}</div>
              </div>
            ))}
          </aside>

          <section className="em-edit">
            <header className="em-edit-h">
              <span className="sub">Invite · transactional</span>
              <h2>{tpl.name}</h2>
              <span className={`badge ${tpl.status}`}>● {tpl.status}</span>
            </header>

            <div className="em-fld">
              <label>Subject line</label>
              <input className="input" value={t.subject} onChange={e=>set('subject', e.target.value)}/>
              <span className="hint">Shows in inbox preview · keep under 60 chars.</span>
            </div>

            <div className="em-fld">
              <label>Preheader</label>
              <input className="input" value={t.preheader} onChange={e=>set('preheader', e.target.value)}/>
              <span className="hint">Snippet shown after subject in inbox lists.</span>
            </div>

            <div className="em-fld">
              <label>Eyebrow</label>
              <input className="input" value={t.eyebrow} onChange={e=>set('eyebrow', e.target.value)}/>
            </div>

            <div className="em-fld">
              <label>Headline</label>
              <input className="input" value={t.headline} onChange={e=>set('headline', e.target.value)}/>
              <span className="hint">Use *italics* for emphasis. **bold** also works.</span>
            </div>

            <div className="em-fld">
              <label>Lead paragraph</label>
              <textarea className="input" value={t.lead} onChange={e=>set('lead', e.target.value)}/>
            </div>

            <div className="em-fld">
              <label>Body</label>
              <textarea className="input" value={t.body} onChange={e=>set('body', e.target.value)}/>
            </div>

            {tpl.kind !== 'starting' && (
              <div className="em-fld">
                <label>Pull quote (optional)</label>
                <textarea className="input" value={t.quote} onChange={e=>set('quote', e.target.value)}/>
                <input className="input" placeholder="Citation" value={t.quoteSrc} onChange={e=>set('quoteSrc', e.target.value)}/>
              </div>
            )}

            <div className="em-fld">
              <label>Primary CTA</label>
              <input className="input" value={t.cta} onChange={e=>set('cta', e.target.value)}/>
            </div>

            <div className="em-fld">
              <label>Secondary CTA</label>
              <input className="input" value={t.ctaSecondary} onChange={e=>set('ctaSecondary', e.target.value)}/>
            </div>

            <div className="em-fld">
              <label>Available variables</label>
              <div className="vars">
                {VARS.map(v => <span key={v} className="var">{v}</span>)}
              </div>
              <span className="hint">Click to copy · gets replaced when each email sends.</span>
            </div>

            <div className="em-cta-row">
              <button className="btn btn-secondary">Send test to me</button>
              <button className="btn btn-primary" style={{marginLeft:'auto'}}>Save template</button>
            </div>
          </section>

          <section className="em-preview">
            <div className="preview-h">
              <h3>Live preview · {device}</h3>
              <div className="device-toggle">
                <button className={device==='desktop'?'on':''} onClick={()=>setDevice('desktop')}>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
                  Desktop
                </button>
                <button className={device==='mobile'?'on':''} onClick={()=>setDevice('mobile')}>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/></svg>
                  Mobile
                </button>
              </div>
            </div>

            <div className={`inbox ${device}`}>
              <div className="inbox-h">
                <Avatar/>
                <div className="from">
                  <b>MrDemonWolf <span style={{fontWeight:400,color:'#888'}}>(via HowlCast)</span></b>
                  <span><span style={{color:'#888'}}>to</span> you · <span style={{color:'#888'}}>from</span> howlcast@mrdemonwolf.com</span>
                </div>
                <span className="at">just now</span>
              </div>
              <div className="inbox-subj">{t.subject}</div>
              <div className="inbox-pre">{t.preheader}</div>
              <MailContent t={t} kind={tpl.kind}/>
            </div>
          </section>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('email-app')).render(<App/>);
  </script>
</body>
</html>
